name: Weekly Connector Canary

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  canary:
    name: Dry-run connectors against live postings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps
      - name: Run connector canaries
        run: uv run pytest tests/e2e -q --tb=short -m "canary" --dry-run
        env:
          AJAA_DRY_RUN: "1"
