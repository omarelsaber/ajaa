<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AJAA{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --accent:    #6366f1;
      --accent-h:  #818cf8;
      --danger:    #ef4444;
      --success:   #22c55e;
      --muted:     #6b7280;
      --text:      #e2e8f0;
      --text-dim:  #94a3b8;
      --radius:    10px;
      --font:      'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── layout ── */
    .shell {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ── nav ── */
    nav {
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
    }
    nav .inner {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    nav .logo {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent);
      letter-spacing: -0.02em;
      text-decoration: none;
    }
    nav .logo span { color: var(--text); }
    nav .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      background: var(--border);
      border-radius: 99px;
      color: var(--text-dim);
    }
    nav .spacer { flex: 1; }
    nav a.nav-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.15s;
    }
    nav a.nav-link:hover { color: var(--text); }

    /* ── main ── */
    main { padding: 2.5rem 0; }

    /* ── cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
    }

    /* ── progress bar ── */
    .progress-wrap { margin-bottom: 2rem; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
    }
    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    /* ── question ── */
    .tier-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
      margin-bottom: 1rem;
    }
    .tier-foundation   { background: #1e3a5f; color: #60a5fa; }
    .tier-professional { background: #1f2937; color: #a78bfa; }
    .tier-preferences  { background: #1a2e1a; color: #4ade80; }
    .tier-safety       { background: #3b1c1c; color: #f87171; }
    .tier-calibration  { background: #2a1f0a; color: #fbbf24; }

    .question-prompt {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }
    .question-hint {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 1.25rem;
    }

    /* ── form elements ── */
    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="url"],
    textarea,
    select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.95rem;
      padding: 0.65rem 0.85rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.18);
    }
    textarea { resize: vertical; min-height: 100px; }

    /* ── radio group for select type ── */
    .option-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .option-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .option-item:hover { border-color: var(--accent); background: rgba(99,102,241,0.07); }
    .option-item input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; }

    /* ── buttons ── */
    .btn-row { display: flex; gap: 0.65rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .btn {
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 1.25rem;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary   { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }

    /* ── alerts ── */
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 7px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
    .alert-error   { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .alert-success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .alert-info    { background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.3); color: #a5b4fc; }

    /* ── HTMX loading indicator ── */
    .htmx-indicator { opacity: 0; transition: opacity 0.2s; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .spinner { display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── complete screen ── */
    .complete-icon {
      font-size: 3.5rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .complete-title {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .complete-sub {
      text-align: center;
      color: var(--text-dim);
      margin-bottom: 1.75rem;
    }
    .stat-row { display: flex; gap: 1rem; }
    .stat {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .stat .value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .stat .label { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.2rem; }

    /* ── misc ── */
    .text-muted { color: var(--text-dim); }
    .text-sm    { font-size: 0.85rem; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav>
  <div class="inner">
    <a class="logo" href="/">AJAA<span>.</span></a>
    <span class="badge">v0.1 alpha</span>
    <span class="spacer"></span>
    <a class="nav-link" href="/interview">Interview</a>
    <a class="nav-link" href="/cv">CVs</a>
    <a class="nav-link" href="/jobs">Jobs</a>
    <a class="nav-link" href="/health">Status</a>
  </div>
</nav>
<main>
  <div class="shell">
    {% block content %}{% endblock %}
  </div>
</main>
</body>
</html>
